user www-data;
worker_processes auto;

error_log /dev/stderr warn;

events {}

http
{
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	access_log /dev/stdout;

	server
	{
		listen 80;
		server_name _;

		root /var/www/html;
		index index.html;

		location /
		{
			try_files $uri $uri/ =404;
		}
	}
}
