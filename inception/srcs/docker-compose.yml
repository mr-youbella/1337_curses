services:
  mariadb:
    image: mariadb:youbella
    build: ./requirements/mariadb
    container_name: mariadb
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    restart: always

  wordpress:
    image: wordpress:youbella
    build: ./requirements/wordpress
    container_name: wordpress
    depends_on:
      mariadb:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    restart: always

  nginx:
    image: nginx:youbella
    build: ./requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    depends_on:
      - wordpress
      - static
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    restart: always

  # Bonus
  static:
    image: static:youbella
    build: ./requirements/bonus/static
    container_name: static
    networks:
      - inception
    restart: always

  redis:
    image: redis:youbella
    build: ./requirements/bonus/redis
    container_name: redis
    networks:
      - inception
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: always

  ftp:
    image: ftp:youbella
    build: ./requirements/bonus/ftp
    container_name: ftp
    depends_on:
      - wordpress
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    ports:
      - "21:21"
      - "10000-10100:10000-10100"
    env_file:
      - .env
    restart: always

  adminer:
    image: adminer:youbella
    build: ./requirements/bonus/adminer
    container_name: adminer
    depends_on:
      - mariadb
    networks:
      - inception
    ports:
      - "8080:8080"
    restart: always

  portainer:
    image: portainer:youbella
    build: ./requirements/bonus/portainer
    container_name: portainer
    networks:
      - inception
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always

networks:
  inception:
    name: inception

volumes:
  wordpress_data:
    driver: local
    name: wordpress_data
    driver_opts:
      type: none
      o: bind
      device: /home/youbella/data/wordpress

  mariadb_data:
    driver: local
    name: mariadb_data
    driver_opts:
      type: none
      o: bind
      device: /home/youbella/data/mariadb

  portainer_data:
    driver: local
    name: portainer_data
    driver_opts:
      type: none
      o: bind
      device: /home/youbella/data/portainer
